name: Build Hermes Hub Gateway (Multi-Platform)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Run Pre-Build Verification Test Gates
        run: npm run verify

      - name: Build Tauri Desktop Application (Fast Bundler)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.8.30
          releaseName: "Hermes Hub Gateway v0.8.30"
          releaseBody: "Release v0.8.30: Native Linux Folder Picker (zenity/kdialog), Cross-Platform OS Auto-Detect IDE Snippet, Zed Editor (~/.config/zed/settings.json) Native Format, and Strict One-Key Privacy Isolation."
          releaseDraft: false
          prerelease: false
