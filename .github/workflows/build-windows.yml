name: Build Hermes Hub Gateway (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_DEPS_CHECK: "true"
        with:
          tagName: v0.4.9
          releaseName: "Hermes Hub Gateway v0.4.9"
          releaseBody: "Release v0.4.9: Comprehensive Architecture Audit & 100% Real Verification Engine. Completely eliminates mock/dummy timers across Git & Gateway tests, replaces them with native git ls-remote and asynchronous HTTP probes, finalizes cohesive high-contrast Light Theme design system across all tabs, triggers initial boot sync, and explicitly binds tray icons."
          releaseDraft: false
          prerelease: false
