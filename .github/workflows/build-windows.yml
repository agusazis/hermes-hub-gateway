name: Build Hermes Hub Gateway (Windows)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_DEPS_CHECK: "true"
        with:
          tagName: v0.2.1
          releaseName: "Hermes Hub Gateway v0.2.1"
          releaseBody: "Release v0.2.1: Central telegram broadcast bot config, explicit non-blank tray icon, and MCP edit/delete support."
          releaseDraft: false
          prerelease: false
