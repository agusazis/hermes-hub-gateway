name: Build Hermes Hub Gateway (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Run Pre-Build Verification Test Gates
        run: npm run verify

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_DEPS_CHECK: "true"
        with:
          tagName: v0.5.3
          releaseName: "Hermes Hub Gateway v0.5.3"
          releaseBody: "Release v0.5.3: Pre-Build Test Gates & Zero-White-Screen Architecture. Features strict TypeScript pre-build validation, Global React Error Boundary preventing empty white screens, dynamic multi-protocol MCP registration suite (Local CLI, Remote SSE, and Env Variables Key-Value builder), verified against full DOM interaction test suite."
          releaseDraft: false
          prerelease: false
