name: Build Hermes Hub Gateway (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: false

      - name: Install frontend dependencies
        run: npm install

      - name: Run Pre-Build Verification Test Gates
        run: npm run verify

      - name: Build Tauri Desktop Application (Fast Bundler)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_DEPS_CHECK: "true"
        with:
          tagName: v0.5.8
          releaseName: "Hermes Hub Gateway v0.5.8"
          releaseBody: "Release v0.5.8: Total Theme Consistency & Empty-State Polish. Completely aligns unselected cards across Skills Hierarchy and MCP Hub into soft slate-50 light styling, adds graceful empty states, and compiles with accelerated Rust caching."
          releaseDraft: false
          prerelease: false
