name: Build Hermes Hub Gateway (Multi-Platform)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Run Pre-Build Verification Test Gates
        run: npm run verify

      - name: Build Tauri Desktop Application (Fast Bundler)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.8.28
          releaseName: "Hermes Hub Gateway v0.8.28"
          releaseBody: "Release v0.8.28: Dynamic Multi-Server Conduit, True Single-File Workspace, and Floppy Disk Skills Icon."
          releaseDraft: false
          prerelease: false
