name: Build Hermes Hub Gateway (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache Action
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_DEPS_CHECK: "true"
        with:
          tagName: v0.4.2
          releaseName: "Hermes Hub Gateway v0.4.2"
          releaseBody: "Release v0.4.2: Enterprise Disaster Recovery Suite. Features Disaster Recovery Center for exporting/importing local HHG client configuration and server Mnemosyne memory snapshot, standalone connection testing for Telegram broadcast bot & Gateway Evaluator/Mnemosyne server, 5s auto-dismiss timers across all tests, and CI/CD build cache optimization."
          releaseDraft: false
          prerelease: false
